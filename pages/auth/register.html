<main id="main-cursor-glow"
    class="relative min-h-screen w-full bg-slate-950 flex flex-col items-center justify-center p-6 overflow-hidden">

    <!-- WRAPPER KONTEN (CARD + HEADER) -->
    <div class="relative w-full max-w-md">

        <!-- LAYER GRID (mengikuti posisi cursor) -->
        <div id="cursor-grid"
            class="fixed inset-0 pointer-events-none bg-[linear-gradient(to_right,#33415535_1px,transparent_1px),linear-gradient(to_bottom,#33415535_1px,transparent_1px)] bg-[size:32px_32px]"
            style="mask-image: radial-gradient(circle 220px at var(--x, -500px) var(--y, -500px), #000 0%, transparent 100%); -webkit-mask-image: radial-gradient(circle 220px at var(--x, -500px) var(--y, -500px), #000 0%, transparent 100%);">
        </div>

        <!-- HEADER LOGO -->
        <div class="relative z-10 flex flex-col items-center mb-8 text-center">
            <div
                class="w-10 h-10 bg-slate-900 border border-slate-700 rounded flex items-center justify-center text-sky-300 mb-4 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-50 tracking-tight">DevVault</h1>
            <p class="text-xs font-mono text-slate-400 mt-1 uppercase tracking-widest">System Initialization</p>
        </div>

        <!-- CARD FORM REGISTER -->
        <div
            class="relative z-10 w-full bg-slate-900/90 border border-slate-700/80 rounded-lg p-6 shadow-2xl backdrop-blur-sm">
            <h2 class="text-xl font-bold text-slate-50 mb-6">Create Account</h2>
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block font-mono text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">
                        FULL NAME
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <input type="text" placeholder="Your name"
                            class="w-full bg-slate-950/80 border border-slate-700 focus:border-sky-400 text-slate-200 font-mono text-sm rounded px-3 py-2.5 pl-9 focus:outline-none shadow-inner" />
                    </div>
                </div>

                <div>
                    <label class="block font-mono text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">
                        EMAIL ADDRESS
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </span>
                        <input type="email" placeholder="dev@example.com"
                            class="w-full bg-slate-50 border border-slate-300 text-slate-700 font-mono text-sm rounded px-3 py-2.5 pl-9 focus:outline-none focus:border-sky-400 placeholder:text-slate-400" />
                    </div>
                </div>

                <div>
                    <label class="block font-mono text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">
                        PASSWORD
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" placeholder="••••••••"
                            class="w-full bg-slate-50 border border-slate-300 text-slate-700 font-mono text-sm rounded px-3 py-2.5 pl-9 focus:outline-none focus:border-sky-400 placeholder:text-slate-400" />
                    </div>
                </div>

                <div>
                    <label class="block font-mono text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">
                        CONFIRM PASSWORD
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" placeholder="••••••••"
                            class="w-full bg-slate-50 border border-slate-300 text-slate-700 font-mono text-sm rounded px-3 py-2.5 pl-9 focus:outline-none focus:border-sky-400 placeholder:text-slate-400" />
                    </div>
                </div>

                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" id="terms"
                        class="mt-0.5 w-4 h-4 rounded border-slate-500 bg-slate-50 accent-sky-400" />
                    <label for="terms" class="text-sm text-slate-300">
                        I agree to the
                        <a href="#" class="text-sky-300 hover:underline">Terms of Service</a>
                        and
                        <a href="#" class="text-sky-300 hover:underline">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-sky-300 to-sky-400 text-sky-950 font-bold text-sm py-3 rounded hover:from-sky-400 hover:to-sky-500 transition-colors shadow-md mt-2 flex items-center justify-center gap-2">
                    Initialize Profile
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                </button>
            </form>

            <div class="relative my-6 text-center">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-800"></div>
                </div>
                <span class="relative bg-slate-900 px-3 font-mono text-[10px] text-slate-400 uppercase tracking-widest">
                    OR AUTHORIZE VIA
                </span>
            </div>

            <button type="button"
                class="w-full bg-transparent border border-sky-400/60 text-sky-300 font-medium text-sm py-2.5 rounded flex items-center justify-center gap-2 hover:bg-slate-800 transition-colors">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path
                        d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                </svg>
                Sign up with GitHub
            </button>

            <!-- LINK KE HALAMAN LOGIN -->
            <p class="relative z-10 text-center text-sm text-slate-400 mt-6">
                Already have access?
                <a href="/login" data-link class="text-sky-300 hover:underline font-semibold">
                    Authenticate here
                </a>
            </p>
        </div>

    </div>

</main>
