<div
    class="relative min-h-screen w-full bg-slate-950 flex flex-col items-center justify-center px-4 py-8 sm:p-6 overflow-hidden">

    <!-- WRAPPER KONTEN (CARD + HEADER) -->
    <div class="relative w-full max-w-md">

        <!-- LAYER GRID -->
        <div id="cursor-grid"
            class="fixed inset-0 pointer-events-none bg-[linear-gradient(to_right,#33415535_1px,transparent_1px),linear-gradient(to_bottom,#33415535_1px,transparent_1px)] bg-[size:32px_32px]"
            style="mask-image: radial-gradient(circle 220px at var(--x, -500px) var(--y, -500px), #000 0%, transparent 100%); -webkit-mask-image: radial-gradient(circle 220px at var(--x, -500px) var(--y, -500px), #000 0%, transparent 100%);">
        </div>

        <!-- HEADER LOGO -->
        <div class="relative z-10 flex flex-col items-center mb-6 sm:mb-8 text-center">
            <div
                class="w-10 h-10 bg-slate-900 border border-slate-700 rounded flex items-center justify-center text-sky-300 mb-4 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-50 tracking-tight">DevVault</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1 px-2">Akses aman untuk para profesional teknologi.</p>
        </div>

        <!-- CARD FORM LOGIN -->
        <div
            class="relative z-10 w-full bg-slate-900/90 border border-slate-700/80 rounded-lg p-5 sm:p-6 shadow-2xl backdrop-blur-sm">

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block font-mono text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">
                        EMAIL
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </span>
                        <input type="email" placeholder="Alamat email" required
                            class="w-full bg-slate-950/80 border border-slate-700 focus:border-sky-400 text-slate-200 font-mono text-sm rounded px-3 py-2.5 pl-9 focus:outline-none shadow-inner" />
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2 gap-2">
                        <label class="font-mono text-xs font-medium uppercase tracking-wider text-slate-400">
                            KATA SANDI
                        </label>
                        <a data-page="lupaPassword.html" class="font-mono text-xs text-sky-300 hover:underline whitespace-nowrap cursor-pointer">Lupa Kata
                            Sandi?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                            </svg>
                        </span>
                        <input type="password" placeholder="Masukkan kata sandi Anda" required
                            class="w-full bg-slate-950/80 border border-slate-700 text-slate-200 font-mono text-sm rounded px-3 py-2.5 pl-9 pr-9 focus:border-sky-300 focus:outline-none" />
                    </div>
                </div>

                <!-- CAPTCHA -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="font-mono text-xs font-medium uppercase tracking-wider text-slate-400">
                            KODE VERIFIKASI
                        </label>
                        <span id="captchaError" class="font-mono text-[10px] text-red-400 hidden">Kode tidak
                            sesuai</span>
                    </div>
                    <div class="flex items-stretch gap-2">
                        <canvas id="captchaCanvas" width="140" height="44"
                            class="rounded border border-slate-700 bg-slate-950/80 shrink-0"></canvas>
                        <button type="button" id="refreshCaptcha"
                            class="shrink-0 w-11 flex items-center justify-center bg-slate-950/80 border border-slate-700 rounded text-slate-300 hover:text-sky-300 hover:border-sky-400 transition-colors cursor-pointer"
                            title="Muat ulang kode">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>
                    <input type="text" id="captchaInput" placeholder="Masukkan 5 karakter di atas" required
                        maxlength="5" autocomplete="off"
                        class="mt-2 w-full bg-slate-950/80 border border-slate-700 text-slate-200 font-mono text-sm rounded px-3 py-2.5 uppercase tracking-widest focus:border-sky-300 focus:outline-none" />
                </div>

                <button type="submit"
                    class="w-full bg-sky-300 text-sky-950 font-mono font-bold text-xs uppercase tracking-wider py-3 rounded hover:bg-sky-400 transition-colors shadow-md mt-2 cursor-pointer">
                    MASUK SEKARANG
                </button>
            </form>

            <div class="relative my-6 text-center">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-800"></div>
                </div>
                <span class="relative bg-slate-900 px-3 font-mono text-[10px] text-slate-400 uppercase tracking-widest">
                    ATAU MASUK DENGAN
                </span>
            </div>

            <button type="button"
                class="w-full bg-slate-950 border border-slate-700 text-slate-200 font-mono font-bold text-xs tracking-wider py-2.5 rounded flex items-center justify-center gap-2 hover:bg-slate-800 transition-colors cursor-pointer">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path
                        d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                </svg>
                GITHUB
            </button>

            <!-- LINK KE HALAMAN REGISTER -->
            <p class="relative z-10 text-center text-xs font-mono text-slate-400 mt-6">
                Belum punya akun?
                <a data-page="register.html" class="text-sky-300 hover:underline font-semibold cursor-pointer">
                    Buat Akun
                </a>
            </p>
        </div>

    </div>

</div>
