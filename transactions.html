<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dompetku — Transaksi</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--canvas:#F6F5F1;--surface:#FFFFFF;--surface-alt:#EFEDE7;--border:#E2DFD6;--ink:#1C1B22;--ink-muted:#6E6C78;--emerald:#1E8F63;--coral:#C34C3C;--amber:#B6790F;--indigo:#4A5FD1;--violet:#7C5CD6;--shadow:0 1px 2px rgba(28,27,34,.06), 0 8px 24px -12px rgba(28,27,34,.10);}
html.dark{--canvas:#12131E;--surface:#1A1C2C;--surface-alt:#222439;--border:#33344E;--ink:#EDEDF7;--ink-muted:#9C9DBE;--emerald:#3FD497;--coral:#FF8B79;--amber:#F2BB4E;--indigo:#8FA6FF;--violet:#B29BF5;--shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.55);}
*{transition:background-color .25s ease,border-color .25s ease,color .25s ease}
button{cursor:pointer}
body{background:var(--canvas);color:var(--ink);font-family:'Inter',sans-serif}
.font-display{font-family:'Fraunces',serif}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.focus-ring:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.card-hover{transition:transform .18s ease,box-shadow .18s ease}
.card-hover:hover{transform:translateY(-3px);box-shadow:0 16px 34px -16px rgba(0,0,0,.22)}
.btn-press:active{transform:scale(.97)}
.bar-fill{width:0%;transition:width 1s cubic-bezier(.22,1,.36,1)}
.chip{font-size:.75rem;font-weight:600;padding:.35rem .75rem;border-radius:999px;border:1px solid var(--border);color:var(--ink-muted);cursor:pointer;white-space:nowrap;background:transparent}
.chip.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
.navlink{display:flex;align-items:center;gap:.75rem;padding:.5rem .75rem;border-radius:.55rem;color:var(--ink-muted);font-size:.875rem;cursor:pointer;text-decoration:none}
.navlink.active{background:var(--indigo-soft);color:var(--indigo);font-weight:600}
.navlink:hover:not(.active){background:var(--surface-alt)}
.switch{width:40px;height:22px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--indigo)}
.switch .dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on .dot{transform:translateX(18px)}
.modal-backdrop{background:rgba(10,10,16,.55);backdrop-filter:blur(2px)}
.cat-row{display:block;width:100%;text-align:left;background:none;border:none;padding:0;cursor:pointer}
.type-chip{cursor:pointer}
.period-btn{cursor:pointer}
.pulse-once{animation:pulseOnce .7s ease}
@keyframes pulseOnce{0%{box-shadow:0 0 0 0 var(--indigo-soft)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-in{animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.fade-out{animation:fadeOut .3s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(.96);max-height:0;margin:0;padding:0}}
#sidebar{display:flex;flex-direction:column;position:fixed;inset:0;top:0;left:0;z-index:30;width:256px;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .2s ease;flex-direction:column;box-shadow:none}
@media(min-width:1024px){#sidebar{-webkit-transform:translateX(0);transform:translateX(0)}}
#sidebar.open{-webkit-transform:translateX(0);transform:translateX(0)}
#sidebar-backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:none}
@media(min-width:1024px){#sidebar-backdrop{display:none!important}}
#sidebar-backdrop.open{display:block}
.toast-container{position:fixed;top:80px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:12px;color:#fff;font-size:14px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .3s ease;pointer-events:auto;display:flex;align-items:center;gap:8px}
.toast-success{background:#1E8F63}
.toast-error{background:#C34C3C}
.toast-info{background:#4A5FD1}
</style>
</head>
<body class="dark">
<div id="sidebar-backdrop"></div>
<aside id="sidebar">
  <div class="h-16 flex items-center gap-2 px-5" style="border-bottom:1px solid var(--border)">
    <span class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold" style="background:var(--indigo);color:#fff">Rp</span>
    <span class="font-display text-lg font-semibold" style="color:var(--ink)">Dompetku</span>
    <button id="btn-sidebar-close" class="ml-auto lg:hidden p-1.5 rounded-lg focus-ring btn-press" style="color:var(--ink-muted)" aria-label="Tutup menu">✕</button>
  </div>
  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-0.5" id="sidebar-nav"></nav>
  <div class="p-3" style="border-top:1px solid var(--border)">
    <div class="flex items-center gap-3 px-3 py-2 rounded-lg" style="background:var(--surface-alt)">
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold shrink-0" style="background:var(--indigo);color:#fff">U</div>
      <div class="leading-tight min-w-0"><p class="text-sm font-medium truncate" id="sidebar-user-name" style="color:var(--ink)">User</p><p class="text-xs" style="color:var(--ink-muted)">Profil pribadi</p></div>
    </div>
    <button id="btn-logout" class="w-full mt-1 flex items-center gap-2 px-3 py-2 rounded-lg focus-ring btn-press" style="color:var(--ink-muted)">Keluar</button>
  </div>
</aside>
<header class="h-16 sticky top-0 z-10 flex items-center justify-between gap-3 px-4 md:px-8" style="background:var(--canvas);border-bottom:1px solid var(--border)">
  <div class="flex items-center gap-3 min-w-0">
    <button id="btn-mobile-menu" class="lg:hidden p-2 rounded-lg focus-ring btn-press" style="border:1px solid var(--border);color:var(--ink-muted)" aria-label="Buka menu">☰</button>
    <div class="hidden sm:flex items-center gap-2 rounded-lg px-3 py-2 w-64" style="background:var(--surface);border:1px solid var(--border)">
      <span style="color:var(--ink-muted)">🔍</span>
      <input type="text" id="global-search" placeholder="Cari transaksi..." class="bg-transparent text-sm w-full outline-none placeholder:opacity-60" style="color:var(--ink)" />
    </div>
  </div>
  <div class="flex items-center gap-2 md:gap-3">
    <button id="btn-theme" class="p-2 rounded-lg focus-ring btn-press" style="border:1px solid var(--border);color:var(--ink-muted)" aria-label="Ubah tema">🌙</button>
    <button id="btn-notification" class="relative p-2 rounded-lg focus-ring btn-press" style="border:1px solid var(--border);color:var(--ink-muted)" aria-label="Notifikasi">🔔<span class="absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full text-[10px] flex items-center justify-center font-semibold" style="background:var(--coral);color:#fff">0</span></button>
    <div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-semibold" style="background:var(--indigo);color:#fff">U</div><span id="topbar-user-name" class="hidden md:block text-sm font-medium" style="color:var(--ink)">User</span></div>
  </div>
</header>
<main id="page-container" class="p-4 md:p-8 max-w-7xl mx-auto" style="color:var(--ink);min-height:calc(100vh - 4rem)"></main>
<div class="toast-container" id="toast-container"></div>

function iconSVG(name, cls = 'w-4 h-4') {

    settings:'<circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82A1.65 1.65 0 003 13.09H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>',

    cash:'<rect x="2" y="7" width="20" height="10" rx="2"/><circle cx="12" cy="12" r="2.5"/><path stroke-linecap="round" d="M6 10v.01M18 14v.01"/>',

// ============================================================
// SIDEBAR COMPONENT
// ============================================================
const SIDEBAR_LINKS = [
  { path: '/', label: 'Dashboard', icon: 'dashboard' },
  { path: '/transactions', label: 'Transaksi', icon: 'transactions' },
  { path: '/accounts', label: 'Akun', icon: 'accounts' },
  { path: '/categories', label: 'Kategori', icon: 'categories' },
  { path: '/budgets', label: 'Budget', icon: 'budgets' },
  { path: '/goals', label: 'Target', icon: 'goals' },
  { path: '/reports', label: 'Laporan', icon: 'reports' },
  { path: '/recurring', label: 'Berulang', icon: 'refresh' },
  { path: '/settings', label: 'Pengaturan', icon: 'settings' }
];

const sidebar = {
  render() {
    const container = document.getElementById('sidebar-nav');
    if (!container) return;
    const activePath = window.location.pathname;
    container.innerHTML = SIDEBAR_LINKS.map(link => `
      <a href="${link.path}" data-route="${link.path}" class="navlink ${activePath === link.path ? 'active' : ''}">
        ${iconSVG(link.icon, 'w-4 h-4')}
        ${link.label}
      </a>
    `).join('');
    this.attachEvents();
  },
  attachEvents() {
    const logoutBtn = document.getElementById('btn-logout');
    const closeBtn = document.getElementById('btn-sidebar-close');
    const backdrop = document.getElementById('sidebar-backdrop');
    if (logoutBtn) logoutBtn.addEventListener('click', () => {
      showToast('Logout berhasil!', 'success');
      window.location.href = '/';
    });
    if (closeBtn) closeBtn.addEventListener('click', () => this.setOpen(false));
    if (backdrop) backdrop.addEventListener('click', () => this.setOpen(false));
    document.querySelectorAll('#sidebar [data-route]').forEach(a => {
      a.addEventListener('click', () => this.setOpen(false));
    });
    document.addEventListener('sidebar:toggle', (e) => this.setOpen(e.detail?.open));
  },
  setOpen(open) {
    const sidebarEl = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    if (sidebarEl) { sidebarEl.classList.toggle('open', !!open); sidebarEl.classList.toggle('-translate-x-full', !open); }
    if (backdrop) backdrop.classList.toggle('open', !!open);
  },
  updateUser(name) {
    const el = document.getElementById('sidebar-user-name');
    if (el) el.textContent = name;
  }
};

// ============================================================
// TOPBAR COMPONENT
// ============================================================
const topbar = {
  notificationCount: 0,
  async render() {
    const isDark = document.documentElement.classList.contains('dark');
    document.getElementById('btn-theme').innerHTML = isDark ? iconSVG('sun', 'w-5 h-5') : iconSVG('moon', 'w-5 h-5');
    document.querySelector('#btn-notification span')?.parentNode?.classList.contains('absolute');
    const notifSpan = document.querySelector('#btn-notification .absolute');
    if (notifSpan) notifSpan.style.display = this.notificationCount > 0 ? '' : 'none';
    if (notifSpan) notifSpan.textContent = this.notificationCount;
  },
  attachEvents() {
    const mobileMenuBtn = document.getElementById('btn-mobile-menu');
    const themeBtn = document.getElementById('btn-theme');
    const notifBtn = document.getElementById('btn-notification');
    const search = document.getElementById('global-search');
    if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', () => {
      document.dispatchEvent(new CustomEvent('sidebar:toggle', { detail: { open: true } }));
    });
    if (themeBtn) themeBtn.addEventListener('click', () => {
      const isNowDark = !document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isNowDark ? 'dark' : 'light');
      this.render();
    });
    if (notifBtn) notifBtn.addEventListener('click', () => {
      this.notificationCount = 0;
      this.render();
    });
    if (search) search.addEventListener('input', (e) => {
      document.dispatchEvent(new CustomEvent('search:changed', { detail: { query: e.target.value } }));
    });
  },
  updateUser(name) {
    const el = document.getElementById('topbar-user-name');
    if (el) el.textContent = name;
  }
};

// ============================================================
// TOAST NOTIFICATIONS
// ============================================================
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icons = { success: iconSVG('success', 'w-5 h-5'), error: iconSVG('alert', 'w-5 h-5'), info: iconSVG('info', 'w-5 h-5') };
  toast.innerHTML = `${icons[type] || icons.info}<span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.classList.add('fade-out'); setTimeout(() => toast.remove(), 300); }, 3000);
}

// ============================================================
// TRANSACTIONS PAGE
// ============================================================
const transactionsPage = {
  filter: 'all',
  _listenersBound: false,

  async render() {
    const container = document.getElementById('page-container');
    if (!container) return;
    container.innerHTML = `
      <div class="max-w-7xl mx-auto">

          <select id="filter-type" class="px-3 py-2 rounded-lg focus-ring" style="border:1px solid var(--border);background:var(--surface);color:var(--ink)">
            <option value="all">Semua Tipe</option>
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
            <option value="transfer">Transfer</option>
          </select>
        </div>
        <div class="rounded-xl overflow-hidden" style="background:var(--surface);border:1px solid var(--border)">
          <table class="w-full">
            <thead><tr style="background:var(--surface-alt)">
              <th class="px-6 py-3 text-left text-xs font-medium uppercase" style="color:var(--ink-muted)">Tanggal</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase" style="color:var(--ink-muted)">Deskripsi</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase" style="color:var(--ink-muted)">Kategori</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase" style="color:var(--ink-muted)">Jumlah</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase" style="color:var(--ink-muted)">Aksi</th>
            </tr></thead>
            <tbody id="transaction-table-body" class="divide-y" style="border-color:var(--border)">
              <tr><td colspan="5" class="px-6 py-4 text-center" style="color:var(--ink-muted)">Memuat...</td></tr>
            </tbody>
          </table>
        </div>
        <!-- Modal -->
        <div id="transaction-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,.5)">
          <div class="rounded-xl p-6 w-full max-w-md" style="background:var(--surface);border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.3)">
            <h3 class="text-lg font-bold mb-4" id="modal-title">Tambah Transaksi</h3>
            <form id="transaction-form" class="space-y-4">
              <input type="hidden" id="tx-id" />
              <div>
                <label class="block text-sm font-medium mb-1" style="color:var(--ink-muted)">Tipe</label>
                <select id="tx-type" class="w-full px-3 py-2 rounded-lg focus-ring" style="border:1px solid var(--border);background:var(--surface);color:var(--ink)">
                  <option value="income">Pemasukan</option><option value="expense">Pengeluaran</option><option value="transfer">Transfer</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" style="color:var(--ink-muted)">Akun</label>
                <select id="tx-account" class="w-full px-3 py-2 rounded-lg focus-ring" style="border:1px solid var(--border);background:var(--surface);color:var(--ink)"><option value="">Memuat...</option></select>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" style="color:var(--ink-muted)">Kategori</label>
                <select id="tx-category" class="w-full px-3 py-2 rounded-lg focus-ring" style="border:1px solid var(--border);background:var(--surface);color:var(--ink)"><option value="">Memuat...</option></select>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" style="color:var(--ink-muted)">Tanggal</label>
                <input type="date" id="tx-date" class="w-full px-3 py-2 rounded-lg focus-ring" style="border:1px solid var(--border);background:var(--surface);color:var(--ink)" />
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" style="color:var(--ink-muted)">Deskripsi</label>
                <input type="text" id="tx-desc" class="w-full px-3 py-2 rounded-lg focus-ring" style="border:1px solid var(--border);background:var(--surface);color:var(--ink)" placeholder="Deskripsi..." />
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" style="color:var(--ink-muted)">Jumlah</label>
                <input type="number" id="tx-amount" class="w-full px-3 py-2 rounded-lg focus-ring" style="border:1px solid var(--border);background:var(--surface);color:var(--ink)" placeholder="0" min="1" />
              </div>
              <div class="flex gap-3">
                <button type="submit" class="flex-1 px-4 py-2 rounded-lg text-white font-medium focus-ring btn-press" style="background:var(--indigo)">Simpan</button>
                <button type="button" id="btn-cancel-modal" class="flex-1 px-4 py-2 rounded-lg focus-ring btn-press" style="background:var(--surface-alt)">Batal</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    `;
    this.attachEvents();
    await this.loadAccountsAndCategories();
    await this.loadData();
  },

  async loadAccountsAndCategories() {
    const accountSelect = document.getElementById('tx-account');
    const categorySelect = document.getElementById('tx-category');
    if (accountSelect) accountSelect.innerHTML = '<option value="">Pilih akun...</option>' + MOCK_ACCOUNTS.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    if (categorySelect) categorySelect.innerHTML = '<option value="">Pilih kategori...</option>' + MOCK_CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  },

  async loadData() {
    const tbody = document.getElementById('transaction-table-body');
    if (!tbody) return;
    let data = [...MOCK_TRANSACTIONS];
    const filter = document.getElementById('filter-type')?.value || 'all';
    if (filter !== 'all') data = data.filter(t => t.type === filter);

    const catMap = {};
    MOCK_CATEGORIES.forEach(c => { catMap[c.id] = c.name; });

    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center">
        <span class="text-4xl mb-3 block">💳</span>
        <p class="font-medium" style="color:var(--ink-muted)">Belum ada transaksi</p>
        <p class="text-sm" style="color:var(--border)">Tambahkan transaksi pertama Anda</p>
      </td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(t => `
      <tr class="hover:opacity-80 transition" style="background:var(--surface)">
        <td class="px-6 py-4 text-sm" style="color:var(--ink-muted)">${new Date(t.date).toLocaleDateString('id-ID')}</td>
        <td class="px-6 py-4 text-sm font-medium" style="color:var(--ink)">${t.description || '-'}</td>
        <td class="px-6 py-4 text-sm" style="color:var(--ink-muted)">${catMap[t.category_id] || t.category_id || '-'}</td>
        <td class="px-6 py-4 text-sm font-bold ${t.type === 'income' ? 'color:var(--emerald)' : 'color:var(--coral)'}">Rp ${Number(t.amount).toLocaleString('id-ID')}</td>
        <td class="px-6 py-4 text-sm">
          <button class="edit-tx text-blue-600 hover:underline focus-ring btn-press" data-id="${t.id}">Edit</button>
          <button class="delete-tx text-red-600 hover:underline ml-3 focus-ring btn-press" data-id="${t.id}">Hapus</button>
        </td>
      </tr>
    `).join('');
  },

  attachEvents() {
    const modal = document.getElementById('transaction-modal');
    const form = document.getElementById('transaction-form');
    const addBtn = document.getElementById('btn-add-transaction');
    const cancelBtn = document.getElementById('btn-cancel-modal');
    const filterSelect = document.getElementById('filter-type');
    const exportExcel = document.getElementById('btn-export-excel');
    const exportPdf = document.getElementById('btn-export-pdf');

    if (addBtn) addBtn.addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Tambah Transaksi';
      document.getElementById('tx-id').value = '';
      if (modal) modal.classList.remove('hidden');
    });
    if (cancelBtn) cancelBtn.addEventListener('click', () => { if (modal) modal.classList.add('hidden'); });
    if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });
    if (form) form.addEventListener('submit', async (e) => { e.preventDefault(); await this.save(); });
    if (filterSelect) filterSelect.addEventListener('change', () => this.loadData());

    if (exportExcel) exportExcel.addEventListener('click', () => this.exportExcel());
    if (exportPdf) exportPdf.addEventListener('click', () => this.exportPDF());

    // Event delegation untuk edit/delete
    const tbody = document.getElementById('transaction-table-body');
    if (tbody) {
      tbody.addEventListener('click', async (e) => {
        const editBtn = e.target.closest('.edit-tx');
        const deleteBtn = e.target.closest('.delete-tx');
        if (editBtn) {
          const tx = MOCK_TRANSACTIONS.find(t => t.id === editBtn.dataset.id);
          if (tx) {
            document.getElementById('modal-title').textContent = 'Edit Transaksi';
            document.getElementById('tx-id').value = tx.id;
            document.getElementById('tx-type').value = tx.type;
            document.getElementById('tx-account').value = tx.account_id || '';
            document.getElementById('tx-category').value = tx.category_id || '';
            document.getElementById('tx-date').value = tx.date;
            document.getElementById('tx-desc').value = tx.description || '';
            document.getElementById('tx-amount').value = tx.amount;
            if (modal) modal.classList.remove('hidden');
          }
        }
        if (deleteBtn) {
          if (confirm('Hapus transaksi ini?')) {
            MOCK_TRANSACTIONS = MOCK_TRANSACTIONS.filter(t => t.id !== deleteBtn.dataset.id);
            await this.loadData();
            showToast('Transaksi berhasil dihapus!', 'success');
          }
        }
      });
    }
  },

  async save() {
    const data = {
      type: document.getElementById('tx-type').value,
      account_id: document.getElementById('tx-account').value,
      category_id: document.getElementById('tx-category').value,
      date: document.getElementById('tx-date').value,
      description: document.getElementById('tx-desc').value,
      amount: parseFloat(document.getElementById('tx-amount').value)
    };
    const id = document.getElementById('tx-id').value;
    if (!data.date || !data.description || !data.amount) {
      showToast('Isi semua field!', 'error');
      return;
    }
    if (id) {
      const idx = MOCK_TRANSACTIONS.findIndex(t => t.id === id);
      if (idx !== -1) { Object.assign(MOCK_TRANSACTIONS[idx], data); showToast('Transaksi berhasil diperbarui!', 'success'); }
    } else {
      MOCK_TRANSACTIONS.unshift({ id: 'tx' + nextId++, ...data });
      showToast('Transaksi berhasil ditambahkan!', 'success');
    }
    document.getElementById('transaction-modal').classList.add('hidden');
    await this.loadData();
  },

  exportExcel() {
    // Buat file CSV sederhana
    const header = 'Tanggal,Deskripsi,Kategori,Jumlah,Tipe\n';
    const rows = MOCK_TRANSACTIONS.map(t => {
      const catName = MOCK_CATEGORIES.find(c => c.id === t.category_id)?.name || '-';
      return `${t.date},"${t.description}","${catName}",${t.amount},${t.type}`;
    }).join('\n');
    const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'finance-dashboard-export.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast('Berhasil export ke Excel!', 'success');
  },

  exportPDF() {
    // Cek apakah jsPDF tersedia
    if (typeof jsPDF !== 'undefined') {
      const { jsPDF: jsPDFClass } = jsPDF;
      const doc = new jsPDFClass();
      doc.setFontSize(16); doc.text('Laporan Transaksi', 14, 22);
      doc.setFontSize(10);
      let y = 30;
      MOCK_TRANSACTIONS.forEach(t => {
        const catName = MOCK_CATEGORIES.find(c => c.id === t.category_id)?.name || '-';
        doc.text(`${t.date} | ${t.description} | ${catName} | Rp ${Number(t.amount).toLocaleString('id-ID')} | ${t.type}`, 14, y);
        y += 7;
        if (y > 270) { doc.addPage(); y = 20; }
      });
      doc.save('finance-dashboard-export.pdf');
      showToast('Berhasil export ke PDF!', 'success');
    } else {
      // Fallback: download HTML sebagai file
      const html = `<html><head><meta charset="UTF-8"><title>Laporan Transaksi</title></head><body><h1>Laporan Transaksi</h1><table border="1" cellpadding="6"><tr><th>Tanggal</th><th>Deskripsi</th><th>Kategori</th><th>Jumlah</th><th>Tipe</th></tr>${MOCK_TRANSACTIONS.map(t => {
        const catName = MOCK_CATEGORIES.find(c => c.id === t.category_id)?.name || '-';
        return `<tr><td>${t.date}</td><td>${t.description}</td><td>${catName}</td><td>Rp ${Number(t.amount).toLocaleString('id-ID')}</td><td>${t.type}</td></tr>`;
      }).join('')}</table></body></html>`;
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'finance-dashboard-export.html'; a.click();
      URL.revokeObjectURL(url);
      showToast('Berhasil export! Buka file HTML di browser.', 'success');
    }
  }
};

// ============================================================
// INITIALIZATION
// ============================================================
async function init() {
  const theme = localStorage.getItem('theme');
  if (theme === 'dark') document.documentElement.classList.add('dark');
  else if (!theme) document.documentElement.classList.add('dark'); // default dark

  sidebar.render();
  topbar.render();
  topbar.attachEvents();
  await transactionsPage.render();

  // Close sidebar on route change
  window.addEventListener('popstate', () => {
    sidebar.render();
    topbar.render();
  });
}

init().catch(e => console.error('Init error:', e));
</script>
</body>
</html>
