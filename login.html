<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - DeVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #F6F5F1;
      --surface: #FFFFFF;
      --surface-alt: #EFEDE7;
      --border: #E2DFD6;
      --ink: #1C1B22;
      --ink-muted: #6E6C78;
      --emerald: #1E8F63;
      --coral: #C34C3C;
      --indigo: #4A5FD1;
      --shadow: 0 1px 2px rgba(28,27,34,.06), 0 8px 24px -12px rgba(28,27,34,.10);
    }
    html.dark {
      --canvas: #12131E;
      --surface: #1A1C2C;
      --surface-alt: #222439;
      --border: #33344E;
      --ink: #EDEDF7;
      --ink-muted: #9C9DBE;
      --emerald: #3FD497;
      --coral: #FF8B79;
      --indigo: #8FA6FF;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.55);
    }
    * { transition: background-color .25s ease, border-color .25s ease, color .25s ease; }
    button { cursor: pointer; }
    body { background: var(--canvas); color: var(--ink); font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Fraunces', serif; }
    .card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
    .btn-press:active { transform: scale(.97); }
  </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8" id="page-container">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900" id="auth-title">Masuk ke Akunmu</h2>
      <p class="mt-2 text-center text-sm text-gray-600" id="auth-subtitle">
        Belum punya akun? <a href="#" id="btn-switch-to-register" class="font-medium text-blue-600 hover:text-blue-500">Daftar baru</a>
      </p>
    </div>
    <form id="auth-form" class="mt-8 space-y-6">
      <div id="auth-name-field" class="hidden">
        <label for="auth-name" class="sr-only">Nama</label>
        <input id="auth-name" name="name" type="text" disabled class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" placeholder="Nama lengkap" />
      </div>
      <div>
        <label for="auth-email" class="sr-only">Email</label>
        <input id="auth-email" name="email" type="email" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" placeholder="Email address" />
      </div>
      <div>
        <label for="auth-password" class="sr-only">Password</label>
        <input id="auth-password" name="password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" placeholder="Password" />
      </div>
      <div id="auth-error" class="hidden text-red-600 text-sm text-center"></div>
      <div>
        <button type="submit" id="auth-submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          <span id="auth-submit-text">Masuk</span>
        </button>
      </div>
    </form>
  </div>

  <script>
    // === Mode Switch Logic ===
    const isRegister = window.location.pathname === '/register';
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const authNameField = document.getElementById('auth-name-field');
    const authSubmitText = document.getElementById('auth-submit-text');

    function setMode(register) {
      if (register) {
        authTitle.textContent = 'Buat Akun Baru';
        authSubtitle.innerHTML = 'Sudah punya akun? <a href="#" id="btn-switch-to-login" class="font-medium text-blue-600 hover:text-blue-500">Masuk</a>';
        authNameField.classList.remove('hidden');
        document.getElementById('auth-name').disabled = false;
        authSubmitText.textContent = 'Daftar';
      } else {
        authTitle.textContent = 'Masuk ke Akunmu';
        authSubtitle.innerHTML = 'Belum punya akun? <a href="#" id="btn-switch-to-register" class="font-medium text-blue-600 hover:text-blue-500">Daftar baru</a>';
        authNameField.classList.add('hidden');
        document.getElementById('auth-name').disabled = true;
        authSubmitText.textContent = 'Masuk';
      }
      // Re-attach switch events
      attachSwitchEvents();
    }

    function attachSwitchEvents() {
      const switchToRegister = document.getElementById('btn-switch-to-register');
      const switchToLogin = document.getElementById('btn-switch-to-login');
      if (switchToRegister) switchToRegister.addEventListener('click', (e) => { e.preventDefault(); setMode(true); });
      if (switchToLogin) switchToLogin.addEventListener('click', (e) => { e.preventDefault(); setMode(false); });
    }

    // === Form Submit Handler ===
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value.trim() || '';
      const errorEl = document.getElementById('auth-error');
      const submitBtn = document.getElementById('auth-submit');
      const isRegister = window.location.pathname === '/register';

      if (!email || !password) {
        errorEl.textContent = 'Email dan Password wajib diisi';
        errorEl.classList.remove('hidden');
        return;
      }
      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Loading...';

      try {
        // Ganti bagian ini dengan fetch ke backend Anda
        console.log('[Auth]', isRegister ? 'Register' : 'Login', { email, password, name });
        if (isRegister) {
          errorEl.textContent = '✅ Registrasi berhasil! Silakan cek email untuk verifikasi.';
          errorEl.classList.remove('hidden');
          errorEl.classList.remove('text-red-600');
          errorEl.classList.add('text-green-600');
          await new Promise(r => setTimeout(r, 2000));
          setMode(false);
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        errorEl.textContent = err.message || 'Terjadi kesalahan. Coba lagi.';
        errorEl.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isRegister ? 'Daftar' : 'Masuk';
      }
    });

    // Init
    setMode(isRegister);
  </script>
</body>
</html>
